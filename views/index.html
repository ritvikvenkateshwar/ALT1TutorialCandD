<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet"
      href="style.css">
    <title>To-Do List</title>
    <meta charset="utf-8" />
    <script src="/client.js" defer></script>
  </head>
  <link rel="stylesheet"
    href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
  <body>
    <header>
      <h1><h1 style="font-family:verdana;"><b></b>To-Do List</b></h1>
        <h1 style="border:2px solid DodgerBlue;">To-Do List</h1>
        <!--To-Do List-->
      </h1>
    </header>
    <main>
      <div class="parent">
        <h3>Add A task</h3>
        <form>
          <label>Name</label><i class="glyphicon glyphicon-user"></i>
          <input id="name" type="text" placeholder="John" /> <br /><br />
          <label>Task</label><i class="glyphicon glyphicon-remove"></i>
          <input id="task" type="text" placeholder="Do My Homework" /> <br /><br />
          <label>Deadline Date</label><i class="glyphicon glyphicon-thumbs-up"></i>
          <input id="date" type="date" /> <br /><br />
  
          <!-- REALLY IMPORTANT to get this to work!! -->
          <!-- Error in the sample code from JE... missing id="submit-btn" HOK -->
          <button id="submit-btn" type="submit">Submit</button>
  
          <!-- found on w3school -->
          <!--<button id="myBtn" type="button" value="Submit">Submit</button> -->
        </form>
        <!-- TUTORIAL D -->
        <p>Tasks:</p>
        <section>
          <ul id="users"></ul>
        </section>
      </div>
    </main>
  </body>
</html>
