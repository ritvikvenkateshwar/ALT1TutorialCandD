<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet"
      href="style.css">
    <title>To-Do List</title>
    <meta charset="utf-8" />
    <script src="/client.js" defer></script>
  </head>
  <body>
    <header>
      <i class="fas fa-file"><,/i>
      <h1>
        To-Do List
      </h1>
    </header>
    <main>
      <h3>Add A task</h3>
      <form>
        <label>Name</label>
        <input id="name" type="text" placeholder="John" /> <br /><br />
        <label>Task</label>
        <input id="task" type="text" placeholder="Do My Homework" /> <br /><br />
        <label>Deadline Date</label>
        <input id="date" type="text" placeholder="dd/mm/yyyy" /> <br /><br />

        <!-- REALLY IMPORTANT to get this to work!! -->
        <!-- Error in the sample code from JE... missing id="submit-btn" HOK -->
        <button id="submit-btn" type="submit">Submit</button>

        <!-- found on w3school -->
        <!--<button id="myBtn" type="button" value="Submit">Submit</button> -->
      </form>
      <!-- TUTORIAL D -->
      <p>Tasks:</p>
      <section>
        <ul id="users"></ul>
      </section>
    </main>
  </body>
</html>
